name: release

# Signed Windows release build on a SELF-HOSTED runner — the signing PC that has the Certum
# code-signing certificate + SimplySign Desktop installed. This workflow is INERT until:
#   1. a self-hosted runner labelled [self-hosted, windows] is registered on that PC,
#   2. SimplySign Desktop is logged in there (so the cloud cert is in CurrentUser\My),
#   3. the repo variable DM_SIGN_THUMBPRINT is set to that cert's SHA-1 thumbprint.
# Full activation runbook: docs/signing-setup.md.
#
# Fires on a version tag (v*) — which also publishes a GitHub Release — or manual dispatch
# (build + sign + upload artifact only, no release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the Release + upload the signed installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: [self-hosted, windows]
    env:
      # Not a secret — a cert thumbprint is a public identifier. Set as a repo VARIABLE.
      DM_SIGN_THUMBPRINT: ${{ vars.DM_SIGN_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — toolchain + live signing session
        shell: pwsh
        run: |
          foreach ($tool in 'bun', 'cargo') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "$tool is not on PATH on this runner" }
          }
          if (-not $env:DM_SIGN_THUMBPRINT) { throw 'repo variable DM_SIGN_THUMBPRINT is not set' }
          # The cert is only in the store while SimplySign Desktop is logged in — fail early otherwise
          # so the build doesn't burn minutes then die at the signing step.
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:DM_SIGN_THUMBPRINT }
          if (-not $cert) { throw "signing cert $env:DM_SIGN_THUMBPRINT not found in CurrentUser\My — log into SimplySign Desktop" }
          "Signing as: $($cert.Subject)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + sign (Tauri signCommand signs the exe AND the NSIS installer)
        run: bunx tauri build --config src-tauri/tauri.release.conf.json

      - name: Upload the signed installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskmakeover-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'no NSIS installer produced' }
          gh release create "${{ github.ref_name }}" "$($installer.FullName)" --title "${{ github.ref_name }}" --generate-notes

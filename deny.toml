# cargo-deny supply-chain gate for the Rust workspace (ADR-0019).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

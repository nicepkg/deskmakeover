[package]
name = "dm-icon-codec"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The shared pixel primitive (`Raster`) and the certified linear-light resampler live in
# the core; the codec never re-implements pixel math (DRY iron rule).
dm-icon-core = { path = "../dm-icon-core" }
sha2 = "0.10"

[dev-dependencies]
# Test fixtures square + sqrt through libm (not std / powi) to honour the determinism
# doctrine — the pinned content-address anchors depend on IEEE-exact fixture pixels.
libm = "0.2"

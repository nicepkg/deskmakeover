[package]
name = "xtask"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
dm-icon-core = { path = "../dm-icon-core" }
serde_json = "1"

[features]
# `--features fast` runs the native comparators (m5-pixels, …) on the fast core so
# the four-way cert covers the fast-native lane; default is the scalar reference.
default = []
fast = ["dm-icon-core/fast"]

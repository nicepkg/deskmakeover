[package]
name = "deskmakeover-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "DeskMakeover desktop shell — thin Tauri 2 composition root (ADR-0019)."
default-run = "deskmakeover-desktop"

# The Tauri commands + lifecycle live in the lib so both the app binary and the
# binding-export tool share one command list (DRY: no second command surface).
[lib]
name = "deskmakeover_desktop_lib"
crate-type = ["lib"]

# The `gen-bindings` binary is auto-discovered from `src/bin/gen-bindings.rs`.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dm-contracts = { path = "../crates/dm-contracts" }
dm-domain = { path = "../crates/dm-domain" }
dm-icon-codec = { path = "../crates/dm-icon-codec" }
dm-operations = { path = "../crates/dm-operations" }
# The resident auto-format decision core + reconcile-loop driver (spec 07, M7). Cross-platform: its
# Windows adapter deps are cfg(windows), so the Mac build carries only the pure driver + reconciler.
dm-resident = { path = "../crates/dm-resident" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta/tauri-specta pinned to the same rc line as dm-contracts.
specta = { version = "=2.0.0-rc.25", features = ["function"] }
specta-typescript = "0.0.12"
# `tray-icon` powers the M7 resident tray surface (spec 07 §12/§16).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# Synthesizes the dev-host's stand-in 256px icon sources at runtime (icon source extraction has
# no cross-platform Rust core, unlike the wallpaper decoder). png-only: we only encode PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
# Decodes the webview-composed compare sheet (icons.exportCompare) before it lands on disk.
base64 = "0.22"

# Desktop-only plugins. `cfg(desktop)` is a Tauri-set cfg unknown to Cargo at
# resolution time, so these must key off the standard target_os cfgs instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Opens About/support links in the default browser and the data folder in the file
# manager (shell.openExternal / shell.openDataFolder). Cross-platform.
tauri-plugin-opener = "2"

# The Windows platform adapters — crash recovery at startup (ADR-0019) + the
# wallpaper topology/applier ports (M6-WIRE A6). Windows-only, so the Mac host
# build carries no dm-windows COM dependency.
[target.'cfg(windows)'.dependencies]
dm-windows = { path = "../crates/dm-windows" }

[dev-dependencies]
tempfile = "3"

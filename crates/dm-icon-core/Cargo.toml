[package]
name = "dm-icon-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# Transcendentals route through libm on both wasm and native for bit-exactness
# (ADR-0019); std math / FMA / SIMD are banned in the core.
libm = "0.2"

# rayon parallelizes native rendering BETWEEN independent icons only (M6 Phase 3) —
# never within an icon's floating-point math, so it is byte-neutral. NATIVE ONLY: the
# wasm preview keeps its outer N-worker parallelism and never links a thread pool, so
# the shipped/certified .wasm (built for wasm32) excludes this entirely.
#
# blake3 content-addresses the output cache (M6 Phase 4a) — it hashes cache KEYS only,
# never pixel output, so its internal SIMD is byte-irrelevant to parity. NATIVE ONLY:
# the wasm preview's exact session repeats are already served by the compositor
# styleLru, so the shipped .wasm stays lean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"
blake3 = "1.8"

[features]
# `fast` gates the byte-safe kernel optimizations (M6 kernel-speed plan). The
# DEFAULT (scalar) build is the determinism reference/oracle — it recomputes
# everything, so the four-way cert can diff the fast path against it at ANY size,
# not only where a TS golden exists (256px). `fast` must stay byte-identical to
# scalar over the full corpus; the cert enforces it. Empty until Phase 1 fills it
# with the geometry mask cache.
default = []
fast = []

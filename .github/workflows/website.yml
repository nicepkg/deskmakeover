name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/assets/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  # a published release changes the site's facts (download CTA, JSON-LD,
  # llms.txt) — rebuild so scripts/fetch-release.mjs bakes them in. NOTE:
  # releases created by release.yml use GITHUB_TOKEN and can NOT fire this
  # trigger (recursion guard), so release.yml also dispatches us directly;
  # this trigger covers releases published/edited by a human.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Both CF secrets are nicepkg ORG secrets (visibility: all). They only
      # reach this repo because it is PUBLIC — on GitHub Free, org secrets are
      # invisible to private repos, and "all repositories" silently means "all
      # public repositories" (this workflow saw an empty token until
      # 2026-07-17, when the repo went public). Kept as a guard so a rotated /
      # removed secret degrades to build-only instead of a red deploy, and so
      # fork PRs never try to deploy.
      CF_DEPLOY_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prebuild resolves the latest GitHub Release into the page (download
      # CTA / JSON-LD / llms.txt), regenerates public/img from
      # ../.github/assets and verifies the committed zh display-font subset
      # still covers every heading glyph
      - name: Build static export
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # release-driven builds exist to publish release facts — a fetch
          # failure there must fail loudly instead of shipping a stale state
          RELEASE_FETCH_STRICT: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: bun run build

      - name: Deploy to Cloudflare (production)
        if: github.event_name != 'pull_request' && env.CF_DEPLOY_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # assets-only deploy (no main entry-point) needs wrangler 4; the
          # action defaults to wrangler 3.x
          wranglerVersion: "4"

      - name: Upload PR preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && env.CF_DEPLOY_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4"
          command: versions upload

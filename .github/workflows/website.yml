name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/assets/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # org secrets only reach public repos on a free-plan org; empty means
      # "build only, skip deploy" until the repo goes public
      CF_DEPLOY_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prebuild regenerates public/img from ../.github/assets and verifies the
      # committed zh display-font subset still covers every heading glyph
      - name: Build static export
        run: bun run build

      - name: Deploy to Cloudflare (production)
        if: github.event_name == 'push' && env.CF_DEPLOY_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # assets-only deploy (no main entry-point) needs wrangler 4; the
          # action defaults to wrangler 3.x
          wranglerVersion: "4"

      - name: Upload PR preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && env.CF_DEPLOY_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4"
          command: versions upload

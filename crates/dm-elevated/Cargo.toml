[package]
name = "dm-elevated"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The single privileged binary (ADR-0019 Amendment 1): a `requireAdministrator` helper whose
# ONLY verbs are the global shortcut-overlay apply/restore pair (ADR-0021). No arbitrary
# commands. Blind-written on Mac; the requireAdministrator manifest is applied at packaging (M8)
# via an external `.exe.manifest`, so this crate carries no resource-compiling build script and
# stays msvc-check-clean on the host.
[[bin]]
name = "dm-elevated"
path = "src/main.rs"

[dependencies]
# Structural ICO validation has ONE truth source: the codec's `parse` (M5.11). The elevated
# helper never re-implements the ICONDIR check — it consumes the codec's public API so an
# overlay payload is validated by exactly the same reader the transaction driver bakes with.
# Pure Rust (dm-icon-core→libm, sha2), so the host msvc cross-check stays clean.
dm-icon-codec = { path = "../dm-icon-codec" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
] }

[dev-dependencies]

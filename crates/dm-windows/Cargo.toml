[package]
name = "dm-windows"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The Windows platform adapters (COM/registry/filesystem) implementing the `dm-domain` ports.
# Blind-written on Mac behind `cfg(windows)` and kept compiling via
# `cargo check -p dm-windows --target x86_64-pc-windows-msvc`. Deliberately free of any
# C-compiling dependency (no rusqlite) so that isolated cross-check compiles offline.
[dependencies]
dm-domain = { path = "../dm-domain" }
# Desktop change watcher (B10, spec 07 §3/§16). Cross-platform (ReadDirectoryChangesW on Windows,
# FSEvents/inotify elsewhere) and pure-Rust bindings — no C toolchain, so the msvc cross-check stays
# offline-clean and the debounce/event-mapping core is unit-testable on the Mac host. `-full` (not
# `-mini`) tracks file ids to fold installer temp-write→rename storms into one settled event.
notify-debouncer-full = "0.7.0"

[dev-dependencies]
# Temp dirs for the host-side durability/atomic-replace tests (durable::write_atomic).
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Per-user Recycle Bin DefaultIcon values (HKCU) — pure-Rust registry, no C build.
winreg = "0.55"
# PNG encode for extracted icon sources (pure Rust — the msvc cross-check stays offline-clean).
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
